<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recipe — DRR Bakery</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
  <div class="app-brandmark">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 2C9 6 7 8.5 7 11.5C7 14.5 9.2 17 12 17C14.8 17 17 14.5 17 11.5C17 8.5 15 6 12 2Z" fill="currentColor"/>
      <path d="M6 20C6 17.7909 8.68629 16 12 16C15.3137 16 18 17.7909 18 20V21H6V20Z" fill="currentColor"/>
    </svg>
    <span>DRR Bakery</span>
  </div>
  <nav>
    <ul class="app-nav">
      <li><a href="dashboard.html">Dashboard</a></li>
      <li><a href="recipes.html" class="active">Recipes &amp; Costing</a></li>
      <li><a href="inventory.html">Inventory</a></li>
      <li><a href="analytics.html">Analytics</a></li>
      <li><a href="admin.html">Admin</a></li>
    </ul>
  </nav>
  <button class="avatar-btn" id="avatar-btn" aria-label="Account">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="12" cy="8" r="4" fill="currentColor"/>
      <path d="M4 20c0-3.5 3.6-6 8-6s8 2.5 8 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </button>
</header>

<main class="app-main">
  <div class="page-heading-row">
    <h1 class="page-heading" id="view-recipe-name">Recipe</h1>
  </div>

  <div class="form-row">
    <div class="field-group">
      <label>Batch size</label>
      <div class="field-control"><input type="text" id="view-batch-size" disabled></div>
    </div>
    <div class="field-group">
      <label>Category</label>
      <div class="field-control"><input type="text" id="view-category" disabled></div>
    </div>
    <div class="field-group">
      <label>Base batch size</label>
      <div class="field-control"><input type="text" id="view-base-batch" disabled></div>
    </div>
    <div class="field-group">
      <label>Portions per piece</label>
      <div class="field-control"><input type="text" id="view-portions" disabled></div>
    </div>
  </div>

  <div class="field-group">
    <label>Preparation notes</label>
    <div class="field-control"><textarea id="view-notes" disabled></textarea></div>
  </div>

  <h2 class="section-title">Ingredients Used</h2>
  <div class="table-wrap">
    <table class="data-table">
      <thead>
        <tr><th>Ingredient</th><th>Category</th><th>Cost/Unit</th><th>Ingredient Cost</th></tr>
      </thead>
      <tbody id="view-ingredients-body"></tbody>
    </table>
  </div>

  <div class="info-box-row">
    <div class="info-box solid">
      <p class="info-label">Total Batch Cost</p>
      <p class="info-value" id="view-total-batch-cost">₱0</p>
    </div>
    <div class="info-box solid">
      <p class="info-label">Cost Per Piece</p>
      <p class="info-value" id="view-cost-per-piece">₱0</p>
    </div>
    <div class="info-box solid">
      <p class="info-label">Yield %</p>
      <p class="info-value" id="view-yield-pct">100%</p>
    </div>
  </div>

  <div class="btn-row">
    <button class="btn-dark" id="edit-recipe-btn" type="button">Edit recipe</button>
  </div>

</main>

<div class="toast" id="app-toast"></div>

<script src="script.js"></script>

</body>
</html>
