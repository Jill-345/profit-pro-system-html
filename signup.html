<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — DRR Bakery</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-shell">

  <div class="auth-photo">
    <div class="auth-brandmark">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M5.5 19.5h13a1.6 1.6 0 0 0 1.6-1.6v-5.4c1.1-.7 1.8-1.8 1.8-3C21.9 7 18.2 4.8 12 4.8S2.1 7 2.1 9.5c0 1.2.7 2.3 1.8 3v5.4a1.6 1.6 0 0 0 1.6 1.6Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
      <path d="M8 9.4l1.7 3M11.6 8.8l1.7 3M15.2 9.4l1.7 3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
    </svg>
      <span>DRR Bakery</span>
    </div>
  </div>

  <div class="auth-form-panel">
    <div class="auth-form-wrap">

      <h1 class="auth-heading" id="signup-heading">Sign Up</h1>
      <p class="auth-subheading" id="signup-subheading"></p>

      <div class="form-alert form-alert-error" id="signup-blocked" role="alert"></div>

      <div id="signup-form-wrap">

      <div class="form-alert" id="signup-alert" role="alert"></div>

      <form id="signup-form" action="#" method="post" novalidate>

        <div class="form-row">
          <div class="field-group">
            <label for="first-name">First Name</label>
            <div class="field-control">
              <input type="text" id="first-name" name="first-name" placeholder="Placeholder">
            </div>
            <p class="field-error" id="first-name-error"></p>
          </div>
          <div class="field-group">
            <label for="last-name">Last Name</label>
            <div class="field-control">
              <input type="text" id="last-name" name="last-name" placeholder="Placeholder">
            </div>
            <p class="field-error" id="last-name-error"></p>
          </div>
        </div>

        <div class="field-group">
          <label for="email">Email</label>
          <div class="field-control">
            <input type="email" id="email" name="email" placeholder="Placeholder">
          </div>
          <p class="field-error" id="email-error"></p>
        </div>

        <div class="field-group">
          <label for="password">Password</label>
          <div class="field-control">
            <input type="password" id="password" name="password" placeholder="Placeholder" data-has-toggle="true">
            <button type="button" class="password-toggle" aria-label="Show password" data-toggle-target="password">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z" stroke="currentColor" stroke-width="1.6"/>
                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/>
              </svg>
            </button>
          </div>
          <p class="field-error" id="password-error"></p>
          <p class="field-hint">It must be at least 8 characters, with uppercase, lowercase, a number, and a symbol.</p>
        </div>

        <button type="submit" class="btn btn-primary">Create an Account</button>

      </form>

      <hr class="auth-divider">

      <p class="auth-footer-link">Already have an account? <a href="index.html">Login</a></p>

      </div>

    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="script.js"></script>

</body>
</html>
