<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — DRR Bakery</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-shell">

  <div class="auth-photo">
    <div class="auth-brandmark">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C9 6 7 8.5 7 11.5C7 14.5 9.2 17 12 17C14.8 17 17 14.5 17 11.5C17 8.5 15 6 12 2Z" fill="currentColor"/>
        <path d="M6 20C6 17.7909 8.68629 16 12 16C15.3137 16 18 17.7909 18 20V21H6V20Z" fill="currentColor"/>
      </svg>
      <span>DRR Bakery</span>
    </div>
  </div>

  <div class="auth-form-panel">
    <div class="auth-form-wrap">

      <h1 class="auth-heading" id="signup-heading">Sign Up</h1>
      <p class="auth-subheading" id="signup-subheading"></p>

      <div class="form-alert form-alert-error" id="signup-blocked" role="alert"></div>

      <div id="signup-form-wrap">

      <div class="form-alert" id="signup-alert" role="alert"></div>

      <form id="signup-form" action="#" method="post" novalidate>

        <div class="form-row">
          <div class="field-group">
            <label for="first-name">First Name</label>
            <div class="field-control">
              <input type="text" id="first-name" name="first-name" placeholder="Placeholder">
            </div>
            <p class="field-error" id="first-name-error"></p>
          </div>
          <div class="field-group">
            <label for="last-name">Last Name</label>
            <div class="field-control">
              <input type="text" id="last-name" name="last-name" placeholder="Placeholder">
            </div>
            <p class="field-error" id="last-name-error"></p>
          </div>
        </div>

        <div class="field-group">
          <label for="email">Email</label>
          <div class="field-control">
            <input type="email" id="email" name="email" placeholder="Placeholder">
          </div>
          <p class="field-error" id="email-error"></p>
        </div>

        <div class="field-group">
          <label for="password">Password</label>
          <div class="field-control">
            <input type="password" id="password" name="password" placeholder="Placeholder" data-has-toggle="true">
            <button type="button" class="password-toggle" aria-label="Show password" data-toggle-target="password">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z" stroke="currentColor" stroke-width="1.6"/>
                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/>
              </svg>
            </button>
          </div>
          <p class="field-error" id="password-error"></p>
          <p class="field-hint">It must be a combination of minimum 8 letters, numbers, and symbols.</p>
        </div>

        <button type="submit" class="btn btn-primary">Create an Account</button>

        <button type="button" class="btn btn-google">
          <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
            <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62Z"/>
            <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.83.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.94v2.33A9 9 0 0 0 9 18Z"/>
            <path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.94A9 9 0 0 0 0 9c0 1.45.35 2.83.94 4.03l3.01-2.33Z"/>
            <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .94 4.97l3.01 2.33C4.66 5.17 6.65 3.58 9 3.58Z"/>
          </svg>
          Login with Google
        </button>

      </form>

      <hr class="auth-divider">

      <p class="auth-footer-link">Already have an account? <a href="index.html">Login</a></p>

      </div>

    </div>
  </div>

</div>

<script src="https://accounts.google.com/gsi/client"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="script.js"></script>

</body>
</html>
