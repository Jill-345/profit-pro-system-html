<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invite Account — DRR Bakery</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
  <div class="app-brandmark">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M5.5 19.5h13a1.6 1.6 0 0 0 1.6-1.6v-5.4c1.1-.7 1.8-1.8 1.8-3C21.9 7 18.2 4.8 12 4.8S2.1 7 2.1 9.5c0 1.2.7 2.3 1.8 3v5.4a1.6 1.6 0 0 0 1.6 1.6Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
      <path d="M8 9.4l1.7 3M11.6 8.8l1.7 3M15.2 9.4l1.7 3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
    </svg>
    <span>DRR Bakery</span>
  </div>
  <nav>
    <ul class="app-nav">
      <li><a href="dashboard.html">Dashboard</a></li>
      <li><a href="recipes.html">Recipes &amp; Costing</a></li>
      <li><a href="inventory.html">Inventory</a></li>
      <li><a href="analytics.html">Analytics</a></li>
      <li><a href="admin.html" class="active">Admin</a></li>
    </ul>
  </nav>
  <button class="avatar-btn" id="avatar-btn" aria-label="Account">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="12" cy="8" r="4" fill="currentColor"/>
      <path d="M4 20c0-3.5 3.6-6 8-6s8 2.5 8 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </button>
</header>

<main class="app-main">

  <div id="invite-form-section">
    <div class="page-heading-row">
      <div></div>
      <div class="btn-row" style="margin-top:0;">
        <a class="btn-dark" href="admin.html">Cancel</a>
        <button class="btn-outline" id="send-invite-btn" type="button">Send Invite</button>
      </div>
    </div>

    <h2 class="section-title" style="margin-top:0;">Invite A New Account</h2>

    <div class="form-row">
      <div class="field-group">
        <label for="invite-name">Full Name</label>
        <div class="field-control"><input type="text" id="invite-name" placeholder="e.g. Nile Von Austria"></div>
      </div>
      <div class="field-group">
        <label for="invite-email">Email</label>
        <div class="field-control"><input type="email" id="invite-email" placeholder="name@example.com"></div>
      </div>
    </div>

    <p class="field-group-label">Assign Role</p>
    <div class="chip-row" id="invite-role-toggle">
      <button type="button" class="chip" data-role="Admin">Admin</button>
      <button type="button" class="chip active" data-role="Staff">Staff</button>
    </div>
  </div>

  <div class="inline-form" id="invite-result-section">
    <h2 class="section-title" style="margin-top:0;">Invite Ready</h2>
    <p class="field-hint">There's no real email server here, so share this link with them yourself — opening it lets them set their password and finish joining.</p>
    <div class="field-group">
      <label for="invite-link-input">Invite link</label>
      <div class="field-control"><input type="text" id="invite-link-input" readonly></div>
    </div>
    <div class="btn-row" style="justify-content:flex-start;">
      <button class="btn-dark" id="copy-invite-link-btn" type="button">Copy link</button>
      <a class="btn-outline" href="admin.html">Done</a>
    </div>
  </div>

</main>

<div class="toast" id="app-toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="script.js"></script>

</body>
</html>
