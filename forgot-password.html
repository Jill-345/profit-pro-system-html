<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — DRR Bakery</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card-shell">
  <div class="auth-card">

    <h1 class="auth-heading">Forgotten your password?</h1>
    <p class="auth-subheading">There is nothing to worry about, we'll send you a message to help you reset your password.</p>

    <div class="form-alert" id="forgot-password-alert" role="alert"></div>

    <form id="forgot-password-form" action="#" method="post" novalidate>
      <div class="field-group">
        <label for="email">Email Address</label>
        <div class="field-control">
          <input type="email" id="email" name="email" placeholder="Enter your email address">
        </div>
        <p class="field-error" id="email-error"></p>
      </div>

      <button type="submit" class="btn btn-primary" style="margin-bottom:0;">Send Reset Link</button>
    </form>

    <a class="back-to-login" href="index.html">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Back to Login
    </a>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="script.js"></script>

</body>
</html>
