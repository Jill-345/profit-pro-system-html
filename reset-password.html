<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set New Password — DRR Bakery</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card-shell">
  <div class="auth-card">

    <h1 class="auth-heading" id="reset-heading">Set a New Password</h1>
    <p class="auth-subheading" id="reset-subheading">Choose a new password for your account.</p>

    <div class="form-alert" id="reset-alert" role="alert"></div>

    <form id="reset-password-form" action="#" method="post" novalidate>
      <div class="field-group">
        <label for="new-password">New Password</label>
        <div class="field-control">
          <input type="password" id="new-password" name="new-password" data-has-toggle="true">
          <button type="button" class="password-toggle" aria-label="Show password" data-toggle-target="new-password">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z" stroke="currentColor" stroke-width="1.6"/>
              <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/>
            </svg>
          </button>
        </div>
        <p class="field-error" id="new-password-error"></p>
        <p class="field-hint">It must be at least 8 characters, with uppercase, lowercase, a number, and a symbol.</p>
      </div>

      <div class="field-group">
        <label for="confirm-password">Confirm New Password</label>
        <div class="field-control">
          <input type="password" id="confirm-password" name="confirm-password">
        </div>
        <p class="field-error" id="confirm-password-error"></p>
      </div>

      <button type="submit" class="btn btn-primary" id="reset-submit-btn" style="margin-bottom:0;">Set New Password</button>
    </form>

    <a class="back-to-login" href="index.html">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Back to Login
    </a>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="script.js"></script>

</body>
</html>
