<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — DRR Bakery</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
  <div class="app-brandmark">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M5.5 19.5h13a1.6 1.6 0 0 0 1.6-1.6v-5.4c1.1-.7 1.8-1.8 1.8-3C21.9 7 18.2 4.8 12 4.8S2.1 7 2.1 9.5c0 1.2.7 2.3 1.8 3v5.4a1.6 1.6 0 0 0 1.6 1.6Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
      <path d="M8 9.4l1.7 3M11.6 8.8l1.7 3M15.2 9.4l1.7 3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
    </svg>
    <span>DRR Bakery</span>
  </div>
  <nav>
    <ul class="app-nav">
      <li><a href="dashboard.html">Dashboard</a></li>
      <li><a href="recipes.html">Recipes &amp; Costing</a></li>
      <li><a href="inventory.html">Inventory</a></li>
      <li><a href="analytics.html">Analytics</a></li>
      <li><a href="admin.html" class="active">Admin</a></li>
    </ul>
  </nav>
  <button class="avatar-btn" id="avatar-btn" aria-label="Account">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="12" cy="8" r="4" fill="currentColor"/>
      <path d="M4 20c0-3.5 3.6-6 8-6s8 2.5 8 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </button>
</header>

<main class="app-main">
  <div class="page-heading-row">
    <h1 class="page-heading">Accounts</h1>
    <a class="btn-dark" href="invite-account.html">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      Invite account
    </a>
  </div>

  <div class="table-wrap">
    <table class="data-table">
      <thead><tr><th>Name</th><th>Role</th><th>Email</th><th>Status</th><th></th></tr></thead>
      <tbody id="accounts-body"></tbody>
    </table>
  </div>

  <h2 class="section-title">Activity log</h2>
  <div class="table-wrap">
    <table class="data-table">
      <thead><tr><th>Date</th><th>Time</th><th>User</th><th>Action</th></tr></thead>
      <tbody id="activity-log-body"></tbody>
    </table>
  </div>

</main>

<div class="toast" id="app-toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="script.js"></script>

</body>
</html>
